<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>구구단을 외자!</title>
<style>
  :root{
    --ink:#1f2140;
    --sky:#4f7cff;
    --sky-deep:#2f5be0;
    --sun:#ffcf3f;
    --good:#2ecc71;
    --bad:#ff6b6b;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #ffe58a 0, transparent 38%),
      radial-gradient(circle at 85% 12%, #b8d0ff 0, transparent 40%),
      linear-gradient(160deg,#eaf1ff,#f6f9ff);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 14px 40px;
  }
  h1{
    font-size:clamp(26px,6vw,40px);
    margin:8px 0 4px;
    letter-spacing:-.5px;
    text-align:center;
  }
  h1 .x{color:var(--sky-deep);}
  .subtitle{color:#7b83a6;margin:0 0 16px;font-size:14px;}

  .scorebar{
    display:flex;
    gap:12px;
    width:100%;
    max-width:420px;
    margin-bottom:14px;
  }
  .stat{
    flex:1;
    background:var(--panel);
    border:3px solid var(--ink);
    border-radius:16px;
    padding:10px 6px;
    text-align:center;
    box-shadow:0 5px 0 rgba(31,33,64,.14);
  }
  .stat .label{font-size:13px;color:#8b91b0;font-weight:700;}
  .stat .value{font-size:30px;font-weight:800;line-height:1.1;}
  .stat.combo .value{color:var(--sky-deep);}

  .card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:3px solid var(--ink);
    border-radius:22px;
    box-shadow:0 8px 0 rgba(31,33,64,.16);
    padding:22px 18px;
    text-align:center;
  }
  .question{
    font-size:clamp(40px,11vw,60px);
    font-weight:800;
    margin:6px 0 4px;
    letter-spacing:1px;
  }
  .question .x{color:var(--sky);}
  #answerBox{
    font-size:44px;
    font-weight:800;
    min-height:60px;
    margin:8px auto 4px;
    padding:6px 10px;
    width:82%;
    border:3px dashed #c6ccec;
    border-radius:14px;
    color:var(--sky-deep);
    letter-spacing:4px;
  }
  #message{
    font-size:20px;
    font-weight:800;
    min-height:30px;
    margin:8px 0 2px;
    transition:transform .15s;
  }
  #message.good{color:var(--good);}
  #message.bad{color:var(--bad);}
  #comboPop{
    height:24px;
    font-size:18px;
    font-weight:800;
    color:var(--sun);
    text-shadow:0 1px 0 rgba(0,0,0,.15);
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
  }
  button{
    font-family:inherit;
    font-weight:800;
    border:3px solid var(--ink);
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(31,33,64,.2);
    transition:transform .05s, box-shadow .05s;
    user-select:none;
  }
  button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(31,33,64,.2);}
  .key{
    font-size:28px;
    padding:16px 0;
    background:#fff;
  }
  .key.wide{grid-column:span 1;}
  .key.del{background:#ffe0a3;font-size:20px;}
  .key.ok{
    grid-column:span 3;
    background:var(--good);
    color:#fff;
    font-size:24px;
    padding:16px 0;
    margin-top:2px;
  }

  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    75%{transform:translateX(8px);}
  }
  @keyframes pop{
    0%{transform:scale(.6);}
    60%{transform:scale(1.15);}
    100%{transform:scale(1);}
  }
  .card.wrong{animation:shake .3s;}
  .card.right{animation:pop .3s;}

  /* 시작/결과 화면 */
  .screen{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:3px solid var(--ink);
    border-radius:22px;
    box-shadow:0 8px 0 rgba(31,33,64,.16);
    padding:30px 22px;
    text-align:center;
  }
  .screen h2{font-size:28px;margin:4px 0 10px;}
  .screen p{color:#6b7196;font-size:15px;line-height:1.6;margin:0 0 20px;}
  .big-btn{
    font-size:24px;
    padding:18px 0;
    width:100%;
    background:var(--sun);
  }
  .result-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#f4f6ff;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:14px 18px;
    margin-bottom:12px;
    font-size:20px;
    font-weight:800;
  }
  .result-row .num{color:var(--sky-deep);font-size:26px;}

  .endbtn{
    width:100%;
    max-width:420px;
    margin-top:12px;
    background:#ffd0d0;
    font-size:18px;
    padding:14px 0;
  }
  .hidden{display:none;}

  /* 난이도 선택 */
  .diff-label{font-size:15px;font-weight:800;color:#5a5470;margin:0 0 10px;}
  .diff-group{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .diff-btn{
    flex:1;
    font-size:16px;
    padding:14px 4px;
    background:#fff;
    line-height:1.2;
  }
  .diff-btn small{display:block;font-size:11px;color:#8b91b0;font-weight:700;margin-top:3px;}
  .diff-btn.sel{background:var(--sky);color:#fff;}
  .diff-btn.sel small{color:#e3ebff;}

  /* 문제별 제한시간 막대 */
  #timeBarWrap{
    height:14px;
    background:#eef0fa;
    border:2px solid var(--ink);
    border-radius:10px;
    margin:0 auto 10px;
    width:82%;
    overflow:hidden;
  }
  #timeBar{
    height:100%;
    width:100%;
    background:var(--good);
    border-radius:8px;
  }
</style>
</head>
<body>
  <h1>구구단을 <span class="x">외자!</span></h1>
  <p class="subtitle">문제를 풀고 콤보를 쌓아 높은 점수에 도전해요 ✨</p>

  <!-- 시작 화면 -->
  <div class="screen" id="startScreen">
    <h2>🎯 준비됐나요?</h2>
    <p>시작 버튼을 누르면 문제가 나와요.<br>맞힐수록 점수가 오르고, 연속으로 맞히면<br>콤보 보너스를 받아요!</p>
    <div class="diff-label">난이도를 골라요</div>
    <div class="diff-group">
      <button class="diff-btn sel" data-diff="easy">쉬움<small>시간 제한 없음</small></button>
      <button class="diff-btn" data-diff="normal">보통<small>문제당 4초</small></button>
      <button class="diff-btn" data-diff="hard">어려움<small>문제당 2.5초</small></button>
    </div>
    <button class="big-btn" id="startBtn">▶️ 게임 시작</button>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="hidden">
  <div class="scorebar">
    <div class="stat">
      <div class="label">점수</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat combo">
      <div class="label">콤보</div>
      <div class="value" id="combo">0</div>
    </div>
    <div class="stat">
      <div class="label">시간</div>
      <div class="value" id="timer">0</div>
    </div>
  </div>

  <div class="card" id="card">
    <div id="comboPop"></div>
    <div id="timeBarWrap" class="hidden"><div id="timeBar"></div></div>
    <div class="question" id="question">7 <span class="x">×</span> 8 = ?</div>
    <div id="answerBox"></div>
    <div id="message">숫자를 눌러 답을 써 보세요!</div>

    <div class="keypad">
      <button class="key" data-n="1">1</button>
      <button class="key" data-n="2">2</button>
      <button class="key" data-n="3">3</button>
      <button class="key" data-n="4">4</button>
      <button class="key" data-n="5">5</button>
      <button class="key" data-n="6">6</button>
      <button class="key" data-n="7">7</button>
      <button class="key" data-n="8">8</button>
      <button class="key" data-n="9">9</button>
      <button class="key del" id="delBtn">⌫ 지우기</button>
      <button class="key" data-n="0">0</button>
      <button class="key del" id="delBtn2" style="visibility:hidden">·</button>
      <button class="key ok" id="okBtn">확인</button>
    </div>
  </div>

  <button class="endbtn" id="endBtn">⏹️ 게임 종료</button>
  </div><!-- /gameScreen -->

  <!-- 결과 화면 -->
  <div class="screen hidden" id="resultScreen">
    <h2>🏁 수고했어요!</h2>
    <div class="result-row"><span>맞힌 점수</span><span class="num" id="finalScore">0</span></div>
    <div class="result-row"><span>맞힌 개수</span><span class="num" id="finalCorrect">0</span></div>
    <div class="result-row"><span>걸린 시간</span><span class="num" id="finalTime">0초</span></div>
    <button class="big-btn" id="againBtn">🔄 다시 하기</button>
  </div>

<script>
(function(){
  let a=2, b=2, answer=4;
  let score=0, combo=0, correctCount=0;
  let current="";
  let locked=false;
  let startTime=0, timerId=null;
  let difficulty="easy", qLimit=0;      // qLimit: 문제당 제한(초), 0이면 무제한
  let qTimerId=null, qDeadline=0;

  const timeBarWrap = document.getElementById("timeBarWrap");
  const timeBar = document.getElementById("timeBar");

  const startScreen = document.getElementById("startScreen");
  const gameScreen = document.getElementById("gameScreen");
  const resultScreen = document.getElementById("resultScreen");
  const timerEl = document.getElementById("timer");
  const qEl = document.getElementById("question");
  const ansEl = document.getElementById("answerBox");
  const msgEl = document.getElementById("message");
  const scoreEl = document.getElementById("score");
  const comboEl = document.getElementById("combo");
  const comboPop = document.getElementById("comboPop");
  const card = document.getElementById("card");

  const GOOD = ["정답이에요! 🎉","잘했어요! 👍","최고예요! 🌟","멋져요! 😃","척척박사! 🧠"];
  const BAD  = ["아쉬워요! 다시 도전! 💪","괜찮아요, 힘내요!","조금만 더! 😊","다음엔 맞힐 수 있어요!"];

  /* ---- 소리 ---- */
  let ac=null;
  function ctx(){ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); return ac; }
  function beep(freqs, dur=0.15){
    const c=ctx(); let t=c.currentTime;
    freqs.forEach(f=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type="square"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.2,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g).connect(c.destination);
      o.start(t); o.stop(t+dur+0.02);
      t+=dur;
    });
  }
  const goodSound=()=>beep([523,659,784],0.12);
  const badSound =()=>beep([220,175],0.18);

  /* ---- 난이도 선택 ---- */
  const LIMITS = { easy:0, normal:4, hard:2.5 };
  document.querySelectorAll(".diff-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".diff-btn").forEach(x=>x.classList.remove("sel"));
      btn.classList.add("sel");
      difficulty = btn.dataset.diff;
    });
  });

  function newQuestion(){
    a = 2 + Math.floor(Math.random()*8); // 2~9단
    b = 2 + Math.floor(Math.random()*8); // 2~9
    answer = a*b;
    qEl.innerHTML = a+' <span class="x">×</span> '+b+' = ?';
    current="";
    ansEl.textContent="";
    startQuestionTimer();
  }

  /* ---- 문제별 제한시간 ---- */
  function stopQuestionTimer(){
    if(qTimerId){ cancelAnimationFrame(qTimerId); qTimerId=null; }
  }
  function startQuestionTimer(){
    stopQuestionTimer();
    if(qLimit<=0){ timeBarWrap.classList.add("hidden"); return; }
    timeBarWrap.classList.remove("hidden");
    qDeadline = Date.now() + qLimit*1000;
    tickQuestion();
  }
  function tickQuestion(){
    const remain = qDeadline - Date.now();
    const ratio = Math.max(0, remain/(qLimit*1000));
    timeBar.style.width = (ratio*100)+"%";
    timeBar.style.background = ratio>0.5 ? "#2ecc71" : ratio>0.25 ? "#ffcf3f" : "#ff6b6b";
    if(remain<=0){ timeUp(); return; }
    qTimerId = requestAnimationFrame(tickQuestion);
  }
  function timeUp(){
    if(locked) return;
    stopQuestionTimer();
    handleWrong("시간 초과! ⏰ 정답은 "+answer+"이에요.");
  }

  function render(){ ansEl.textContent = current; }

  document.querySelectorAll(".key[data-n]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(locked) return;
      if(current.length>=2) return;
      current += btn.dataset.n;
      render();
    });
  });
  document.getElementById("delBtn").addEventListener("click",()=>{
    if(locked) return;
    current = current.slice(0,-1);
    render();
  });

  document.getElementById("okBtn").addEventListener("click",submit);

  /* ---- 실제 키보드 입력 ---- */
  document.addEventListener("keydown",e=>{
    // 시작/결과 화면에서 엔터로 시작
    if(e.key==="Enter" && !startScreen.classList.contains("hidden")){ startGame(); return; }
    if(e.key==="Enter" && !resultScreen.classList.contains("hidden")){ startGame(); return; }
    // 게임 화면일 때만 반응
    if(gameScreen.classList.contains("hidden")) return;
    if(locked) return;
    if(e.key>="0" && e.key<="9"){
      if(current.length<2){ current+=e.key; render(); }
    }else if(e.key==="Backspace"){
      e.preventDefault();
      current=current.slice(0,-1); render();
    }else if(e.key==="Enter"){
      e.preventDefault();
      submit();
    }
  });

  function submit(){
    if(locked || current==="") return;
    stopQuestionTimer();
    locked=true;
    const val = parseInt(current,10);
    if(val===answer){
      combo++;
      correctCount++;
      const gained = 10 + (combo-1)*5;
      score += gained;
      scoreEl.textContent = score;
      comboEl.textContent = combo;
      msgEl.textContent = GOOD[Math.floor(Math.random()*GOOD.length)]+" (+"+gained+"점)";
      msgEl.className="good";
      card.classList.add("right");
      goodSound();
      if(combo>=2){
        comboPop.textContent = combo+"콤보! 🔥";
        comboPop.style.animation="pop .3s";
        setTimeout(()=>comboPop.style.animation="",300);
      }
      nextAfterDelay();
    }else{
      handleWrong(BAD[Math.floor(Math.random()*BAD.length)]+" 정답은 "+answer+"이에요.");
    }
  }

  function handleWrong(text){
    locked=true;
    combo=0;
    comboEl.textContent=0;
    comboPop.textContent="";
    msgEl.textContent = text;
    msgEl.className="bad";
    card.classList.add("wrong");
    badSound();
    nextAfterDelay();
  }

  function nextAfterDelay(){
    setTimeout(()=>{
      card.classList.remove("right","wrong");
      msgEl.className="";
      msgEl.textContent="숫자를 눌러 답을 써 보세요!";
      newQuestion();
      locked=false;
    },1400);
  }

  /* ---- 시작 / 종료 / 타이머 ---- */
  function startGame(){
    score=0; combo=0; correctCount=0; current=""; locked=false;
    qLimit = LIMITS[difficulty];
    scoreEl.textContent=0; comboEl.textContent=0; comboPop.textContent="";
    msgEl.className=""; msgEl.textContent="숫자를 눌러 답을 써 보세요!";
    startScreen.classList.add("hidden");
    resultScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    newQuestion();
    // 타이머
    startTime = Date.now();
    timerEl.textContent = 0;
    if(timerId) clearInterval(timerId);
    timerId = setInterval(()=>{
      timerEl.textContent = Math.floor((Date.now()-startTime)/1000);
    },500);
  }

  function endGame(){
    if(timerId){ clearInterval(timerId); timerId=null; }
    stopQuestionTimer();
    const secs = Math.floor((Date.now()-startTime)/1000);
    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalCorrect").textContent = correctCount+"개";
    document.getElementById("finalTime").textContent = secs+"초";
    gameScreen.classList.add("hidden");
    resultScreen.classList.remove("hidden");
  }

  document.getElementById("startBtn").addEventListener("click",startGame);
  document.getElementById("againBtn").addEventListener("click",startGame);
  document.getElementById("endBtn").addEventListener("click",endGame);

  newQuestion();
})();
</script>
</body>
</html>
